<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nati — natillera assistant</title>
<style>
  /* Dark theme via CSS variables, matching the team's other tool. Reskin here. */
  :root {
    --bg: #14161b; --panel: #1c1f26; --panel2: #232732; --line: #2c313c;
    --ink: #e7e9ee; --muted: #9aa3b2; --accent: #7aa2ff;
    --user: #2a3550; --ok: #6fcf97; --refused: #f2c94c; --error: #eb5757;
    --blocked: #7aa2ff;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  #app {
    width: 100%; max-width: 760px; height: 100dvh;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  header button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  header button:hover { color: var(--ink); border-color: var(--muted); }

  #log {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .bubble {
    padding: 9px 12px; border-radius: var(--radius); max-width: 88%;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .bubble.user { align-self: flex-end; background: var(--user); }
  .bubble.nati {
    align-self: flex-start; background: var(--panel);
    border: 1px solid var(--line);
  }
  .bubble.error {
    align-self: flex-start; background: var(--panel);
    border: 1px solid var(--error); color: #ffd9d9;
  }
  .empty { color: var(--muted); text-align: center; margin: auto; max-width: 460px; }
  .empty code { color: var(--accent); }

  /* ---------------------------------------------------------------------
     Rendered markdown (Nati's replies only). A reply is a message, not a
     document, so the vertical rhythm is tight and the first/last child never
     adds outer margin. Block elements handle their own wrapping, so
     `white-space` returns to normal here.
     --------------------------------------------------------------------- */
  .md { white-space: normal; }
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p { margin: 0 0 .6em; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
    margin: .9em 0 .4em; line-height: 1.25; font-weight: 650;
  }
  .md h1 { font-size: 1.22em; }
  .md h2 { font-size: 1.12em; }
  .md h3 { font-size: 1.04em; }
  .md h4, .md h5, .md h6 { font-size: 1em; color: var(--muted); }
  .md ul, .md ol { margin: 0 0 .6em; padding-left: 1.35em; }
  .md li { margin: .15em 0; }
  .md li > ul, .md li > ol { margin: .15em 0; }
  /* Figures usually arrive bolded, so bold has to read as emphasis, not noise. */
  .md strong { font-weight: 650; color: #fff; }
  .md em { font-style: italic; }
  .md del { opacity: .6; }
  .md code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .9em; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 5px; padding: .1em .35em;
  }
  .md pre {
    margin: 0 0 .6em; padding: 10px 12px; overflow-x: auto;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
  }
  .md pre code { background: none; border: none; padding: 0; font-size: .88em; }
  .md blockquote {
    margin: 0 0 .6em; padding: .1em 0 .1em .8em; color: var(--muted);
    border-left: 3px solid var(--line);
  }
  .md hr { border: none; border-top: 1px solid var(--line); margin: .8em 0; }
  /* Tables scroll inside their own box so a wide one never widens the bubble. */
  .md .tablewrap { overflow-x: auto; margin: 0 0 .6em; }
  .md table { border-collapse: collapse; font-size: .95em; }
  .md th, .md td { border: 1px solid var(--line); padding: .35em .6em; }
  .md th { background: var(--panel2); font-weight: 650; }

  /* Tool-call steps, shown above the reply they produced. */
  .steps { align-self: flex-start; max-width: 88%; display: flex;
           flex-direction: column; gap: 3px; margin-bottom: -4px; }
  .step {
    font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace;
    display: flex; gap: 7px; align-items: center;
  }
  .step .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .step.ok .dot { background: var(--ok); }
  .step.refused .dot { background: var(--refused); }
  /* The output filter suppressing a reply. Blue, not red: the
     control worked. */
  .step.blocked .dot { background: var(--blocked); }
  .step.blocked { color: var(--blocked); }
  .step.error .dot { background: var(--error); }
  .step .note { color: var(--muted); opacity: .8; }

  /* Typing indicator. */
  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  footer { padding: 12px 18px 16px; border-top: 1px solid var(--line); }
  #row { display: flex; gap: 8px; align-items: flex-end; }
  #input {
    flex: 1; resize: none; background: var(--panel2); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; font: inherit; max-height: 160px;
  }
  #input:focus { outline: none; border-color: var(--accent); }
  #send {
    background: var(--accent); color: #0d1017; border: none;
    border-radius: var(--radius); padding: 10px 16px; font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 11px; margin: 6px 2px 0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Nati</h1>
    <span class="sub">natillera assistant</span>
    <span class="spacer"></span>
    <button id="reset">New conversation</button>
  </header>
  <div id="log"></div>
  <footer>
    <div id="row">
      <textarea id="input" rows="1" placeholder="Ask Nati about the books…"
                autofocus></textarea>
      <button id="send">Send</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line · your conversation is kept in this browser</div>
  </footer>
</div>

<script type="module">
// ---------------------------------------------------------------------------
// Small, separated concerns: api, store, render, and the controller at the end.
// No framework and no build step — just ES modules in one file.
// ---------------------------------------------------------------------------

// --- api: the one call to the backend ------------------------------------
const api = {
  async chat(message, convId) {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, conv_id: convId }),
    });
    if (!res.ok) {
      let detail = `HTTP ${res.status}`;
      try { detail = (await res.json()).detail || detail; } catch {}
      throw new Error(detail);
    }
    return res.json();
  },
};

// --- store: session persistence in localStorage --------------------------
const store = {
  KEY: "nati.session.v1",
  load() {
    try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; }
    catch { return {}; }
  },
  save(state) { localStorage.setItem(this.KEY, JSON.stringify(state)); },
  clear() { localStorage.removeItem(this.KEY); },
};

// --- markdown: a small, deliberately strict renderer ---------------------
// Model output is UNTRUSTED. Everything is HTML-escaped FIRST and the
// formatting patterns are then applied to the ESCAPED text, so no tag the
// model writes can ever become a tag the browser runs. That ordering is the
// whole security argument — do not reorder it, and never pass raw model text
// to innerHTML anywhere else.
const md = (() => {
  function escapeHtml(s) {
    return s
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // Sentinels fencing off an extracted code span. Written as escapes so
  // they stay visible in source, and stripped from the input before
  // anything runs, so the model cannot forge one to smuggle text past
  // the emphasis pass.
  const OPEN = "\u0001", CLOSE = "\u0002";

  // Inline formatting, applied per line of already-escaped text. Code spans
  // are lifted out first so emphasis markers inside them stay literal.
  function inline(text) {
    const spans = [];
    let out = text.replace(/`([^`]+)`/g, (_, code) => {
      spans.push(code);
      return `${OPEN}${spans.length - 1}${CLOSE}`;
    });

    out = out
      .replace(/\*\*\*(\S(?:[\s\S]*?\S)?)\*\*\*/g, "<strong><em>$1</em></strong>")
      .replace(/\*\*(\S(?:[\s\S]*?\S)?)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*(\S(?:[\s\S]*?\S)?)\*(?![*\w])/g, "$1<em>$2</em>")
      .replace(/(^|[^_\w])__(\S(?:[\s\S]*?\S)?)__(?![_\w])/g, "$1<strong>$2</strong>")
      .replace(/(^|[^_\w])_(\S(?:[\s\S]*?\S)?)_(?![_\w])/g, "$1<em>$2</em>")
      .replace(/~~(\S(?:[\s\S]*?\S)?)~~/g, "<del>$1</del>");

    // A link becomes its label plus the bare URL as TEXT — never an anchor.
    // A clickable destination chosen by the model is a phishing surface, and
    // an assistant reading a local ledger has no legitimate need for one.
    out = out.replace(/\[([^\]]*)\]\(([^)\s]+)\)/g, (_, label, url) =>
      label ? `${label} (${url})` : url);

    return out.replace(new RegExp(`${OPEN}(\\d+)${CLOSE}`, "g"), (_, i) => `<code>${spans[i]}</code>`);
  }

  // A table's separator row (|---|:--:|---:|) carries column alignment.
  function alignments(row) {
    return cells(row).map((c) =>
      /^:-+:$/.test(c) ? "center" : /^-+:$/.test(c) ? "right" : "left");
  }

  function cells(row) {
    return row.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|")
              .map((c) => c.trim());
  }

  const isTableSep = (line) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/
    .test(line || "") && (line || "").includes("-");

  function render(raw) {
    // Strip control characters (keeping tabs) so the code-span placeholder
    // cannot be forged by the model emitting one itself.
    const text = String(raw ?? "")
      .replace(/\r\n?/g, "\n")
      .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, "");
    const lines = escapeHtml(text).split("\n");
    const out = [];
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      if (!line.trim()) { i++; continue; }

      // Fenced code — content stays literal, no inline pass over it.
      const fence = line.match(/^\s*(```|~~~)\s*([\w+-]*)\s*$/);
      if (fence) {
        const marker = fence[1];
        const body = [];
        i++;
        while (i < lines.length &&
               !new RegExp(`^\\s*${marker}\\s*$`).test(lines[i])) {
          body.push(lines[i]); i++;
        }
        i++;  // consume the closing fence (absent at end of text: fine)
        out.push(`<pre><code>${body.join("\n")}</code></pre>`);
        continue;
      }

      const heading = line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
      if (heading) {
        const level = heading[1].length;
        out.push(`<h${level}>${inline(heading[2])}</h${level}>`);
        i++; continue;
      }

      if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) {
        out.push("<hr>"); i++; continue;
      }

      if (/^\s{0,3}&gt;\s?/.test(line)) {
        const body = [];
        while (i < lines.length && /^\s{0,3}&gt;\s?/.test(lines[i])) {
          body.push(lines[i].replace(/^\s{0,3}&gt;\s?/, "")); i++;
        }
        out.push(`<blockquote>${render(unescapeForNested(body.join("\n")))}</blockquote>`);
        continue;
      }

      // Table: a header row followed by a separator row.
      if (line.includes("|") && isTableSep(lines[i + 1])) {
        const align = alignments(lines[i + 1]);
        const head = cells(line).map((c, n) =>
          `<th style="text-align:${align[n] || "left"}">${inline(c)}</th>`);
        i += 2;
        const body = [];
        while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
          body.push(`<tr>${cells(lines[i]).map((c, n) =>
            `<td style="text-align:${align[n] || "left"}">${inline(c)}</td>`
          ).join("")}</tr>`);
          i++;
        }
        out.push(
          `<div class="tablewrap"><table><thead><tr>${head.join("")}</tr>` +
          `</thead><tbody>${body.join("")}</tbody></table></div>`
        );
        continue;
      }

      // Lists, with nesting driven by indentation.
      const item = line.match(/^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/);
      if (item) {
        const [html, next] = list(lines, i);
        out.push(html); i = next; continue;
      }

      // Paragraph: consecutive non-blank lines that start no other block.
      const para = [];
      while (i < lines.length && lines[i].trim() &&
             !startsBlock(lines, i)) {
        para.push(lines[i].trim()); i++;
      }
      // A single newline inside a paragraph is a real line break in model
      // output (addresses, short enumerations), so it is kept.
      out.push(`<p>${inline(para.join("\n")).replace(/\n/g, "<br>")}</p>`);
    }

    return out.join("");
  }

  function startsBlock(lines, i) {
    const line = lines[i];
    return /^\s*(```|~~~)/.test(line)
        || /^\s{0,3}#{1,6}\s/.test(line)
        || /^\s{0,3}&gt;\s?/.test(line)
        || /^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)
        || /^(\s*)([-*+]|\d{1,9}[.)])\s+/.test(line)
        || (line.includes("|") && isTableSep(lines[i + 1]));
  }

  // Blockquote bodies are re-rendered, so their already-escaped text must not
  // be escaped a second time.
  function unescapeForNested(s) {
    return s.replace(/&lt;/g, "<").replace(/&gt;/g, ">")
            .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
            .replace(/&amp;/g, "&");
  }

  // Builds one list (and any nested lists) starting at `start`.
  // Returns [html, indexAfterTheList].
  function list(lines, start) {
    const first = lines[start].match(/^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/);
    const baseIndent = first[1].length;
    const ordered = /\d/.test(first[2]);
    const items = [];
    let i = start;

    while (i < lines.length) {
      const m = lines[i].match(/^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/);
      if (!m) break;
      const indent = m[1].length;
      if (indent < baseIndent) break;
      if (indent > baseIndent) {
        const [nested, next] = list(lines, i);
        if (items.length) items[items.length - 1] += nested;
        else items.push(nested);
        i = next;
        continue;
      }
      if (ordered !== /\d/.test(m[2])) break;  // a different list starts here
      items.push(inline(m[3].trim()));
      i++;
      // A continuation line (indented, not itself an item) joins the item.
      while (i < lines.length && lines[i].trim() &&
             !/^(\s*)([-*+]|\d{1,9}[.)])\s+/.test(lines[i]) &&
             lines[i].search(/\S/) > baseIndent) {
        items[items.length - 1] += " " + inline(lines[i].trim());
        i++;
      }
    }

    const tag = ordered ? "ol" : "ul";
    const startAttr = ordered && first[2].replace(/\D/g, "") !== "1"
      ? ` start="${parseInt(first[2], 10)}"` : "";
    return [
      `<${tag}${startAttr}>${items.map((x) => `<li>${x}</li>`).join("")}</${tag}>`,
      i,
    ];
  }

  return { render, escapeHtml };
})();

// --- render: turn state into DOM -----------------------------------------
const log = document.getElementById("log");

function scrollDown() { log.scrollTop = log.scrollHeight; }

function bubble(role, text) {
  const el = document.createElement("div");
  el.className = "bubble " + role;
  if (role === "nati") {
    // Only Nati's replies are formatted. What the administrator typed is shown
    // exactly as she typed it, and an error is a fixed sentence of ours —
    // neither needs a parser, so neither gets one.
    el.classList.add("md");
    el.innerHTML = md.render(text);
  } else {
    el.textContent = text;
  }
  log.appendChild(el);
  scrollDown();
  return el;
}

function renderSteps(steps) {
  if (!steps || !steps.length) return;
  const wrap = document.createElement("div");
  wrap.className = "steps";
  for (const s of steps) {
    const row = document.createElement("div");
    row.className = "step " + s.status;
    const verb = s.status === "refused" ? "refused"
               : s.status === "error" ? "error"
               : s.status === "blocked" ? "" : "used";
    // Built as nodes, not markup: the tool name comes from the server, and
    // nothing that crosses the wire is ever interpolated into innerHTML.
    const dot = document.createElement("span");
    dot.className = "dot";
    const label = document.createElement("span");
    label.append(verb + " ");
    const name = document.createElement("b");
    name.textContent = s.name;
    label.append(name);
    row.append(dot, label);
    if ((s.status === "refused" || s.status === "blocked") && s.message) {
      const note = document.createElement("span");
      note.className = "note";
      note.textContent = "— " + s.message;
      row.appendChild(note);
    }
    wrap.appendChild(row);
  }
  log.appendChild(wrap);
  scrollDown();
}

function showTyping() {
  const el = document.createElement("div");
  el.className = "typing";
  el.innerHTML = "<span></span><span></span><span></span>";
  log.appendChild(el);
  scrollDown();
  return el;
}

function renderEmpty() {
  log.innerHTML = `<div class="empty">
    I keep the books for a 29-member natillera. Ask me things like
    <br><br><code>What's in the fund?</code><br>
    <code>How much has Carlos saved?</code><br>
    <code>Record a $50 saving for member 2 (Carlos)</code>
  </div>`;
}

// --- controller ----------------------------------------------------------
const input = document.getElementById("input");
const send = document.getElementById("send");
let convId = null;
let busy = false;

function boot() {
  const s = store.load();
  convId = s.convId || null;
  if (s.messages && s.messages.length) {
    log.innerHTML = "";
    for (const m of s.messages) {
      if (m.steps) renderSteps(m.steps);
      bubble(m.role, m.text);
    }
  } else {
    renderEmpty();
  }
}

function persist(role, text, steps) {
  const s = store.load();
  s.convId = convId;
  s.messages = s.messages || [];
  s.messages.push({ role, text, steps });
  store.save(s);
}

async function submit() {
  const text = input.value.trim();
  if (!text || busy) return;
  if (log.querySelector(".empty")) log.innerHTML = "";

  busy = true; send.disabled = true;
  input.value = ""; input.style.height = "auto";
  bubble("user", text);
  persist("user", text, null);

  const typing = showTyping();
  try {
    const data = await api.chat(text, convId);
    convId = data.conv_id;
    typing.remove();
    renderSteps(data.steps);
    bubble(data.ok ? "nati" : "error", data.reply);
    persist(data.ok ? "nati" : "error", data.reply, data.steps);
  } catch (err) {
    typing.remove();
    const msg = "Something went wrong: " + err.message +
                ". Is the server running (uv run nati serve)?";
    bubble("error", msg);
    persist("error", msg, null);
  } finally {
    busy = false; send.disabled = false;
    input.focus();
  }
}

// input grows with content; Enter sends, Shift+Enter is a newline
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});
send.addEventListener("click", submit);
document.getElementById("reset").addEventListener("click", () => {
  store.clear(); convId = null; renderEmpty(); input.focus();
});

boot();
</script>
</body>
</html>
