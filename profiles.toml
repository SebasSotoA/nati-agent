# Model profiles.
#
# THIS FILE IS THE ONLY PLACE A MODEL IS NAMED. Nothing in the code depends on
# which model is used, or on which family it belongs to. Swapping models is an
# edit here, or a single environment variable — never a code change.
#
# The platform is AWS Bedrock, reached through its OpenAI-Chat-Completions
# compatible endpoint. Any Bedrock model that supports tool calling will work.
#
# The exercise requires an OPEN-WEIGHT model: no Claude, no GPT. Anything else
# is a free choice.
#
# The region is FIXED per profile on purpose: reading it from AWS_REGION would
# give a teammate whose default is ca-central-1 an incomprehensible error.
#
# Authentication: NATI_API_KEY (or AWS_BEARER_TOKEN_BEDROCK). Never in a file
# that is committed.
#
# --------------------------------------------------------------------------
# To switch models
# --------------------------------------------------------------------------
#   Permanently:  change `model` below, or add a new [profiles.<name>] block
#   For one run:  uv run nati doctor --profile <name>
#   Ad hoc:       NATI_MODEL="<bedrock-model-id>" uv run nati doctor
#
# `nati doctor` verifies whatever is configured: that the id resolves, that tool
# calling works, and whether the model returns a Chain of Thought. If a model
# does not support tools, doctor says so rather than failing mysteriously later.
# --------------------------------------------------------------------------

default_profile = "default"

[profiles.default]
model = "qwen.qwen3-32b"
base_url = "https://bedrock-mantle.us-west-2.api.aws/v1"
region = "us-west-2"
max_tokens = 4096
# Some reasoning models only return their Chain of Thought when it is explicitly
# requested; others ignore this field entirely. Harmless either way, and the
# Chain of Thought is one of the exercise's deliverables.
reasoning_effort = "high"
temperature = 0.1
description = "Default target for the exercise. Open-weight (Qwen3, Apache 2.0)."

[profiles.nemotron]
model = "nvidia.nemotron-super-3-120b"
base_url = "https://bedrock-mantle.us-west-2.api.aws/v1"
region = "us-west-2"
max_tokens = 4096
reasoning_effort = "high"
temperature = 0.1
description = "Larger alternative. Open-weight, strong tool calling."

[profiles.fast]
model = "nvidia.nemotron-nano-3-30b"
base_url = "https://bedrock-mantle.us-west-2.api.aws/v1"
region = "us-west-2"
max_tokens = 4096
reasoning_effort = "medium"
temperature = 0.1
description = "Smaller and cheaper, for iterating while building."

# --------------------------------------------------------------------------
