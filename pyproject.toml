[project]
name = "nati"
version = "0.1.0"
description = "Natillera Bot — asistente para una natillera colombiana"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "openai>=1.40",
    "rich>=13.7",
    # The web chat (`nati serve`). Kept minimal: FastAPI + an ASGI server, no
    # Node, no build step. Imported lazily so doctor/seed/fund/tools still work
    # even if these are ever absent.
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
nati = "nati.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nati"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
